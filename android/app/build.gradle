plugins {
    id 'com.android.application'
}

def versionFile = file("../../VERSION")
def appVersionName = versionFile.exists() ? versionFile.text.trim() : "0.1"

android {
    namespace 'com.musicworld.recreation'
    compileSdk 34

    defaultConfig {
        applicationId "com.musicworld.recreation"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName appVersionName

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared", "-DMW_USE_SYSTEM_RAYLIB=OFF"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "x86", "x86_64"
        }
        ndkVersion "27.2.12479018"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "src/main/AndroidManifest.xml"
            // Use repo assets directly; no need to duplicate/copy the assets folder.
            assets.srcDirs = ["../../assets"]
        }
    }
}
